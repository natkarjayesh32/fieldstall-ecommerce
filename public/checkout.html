<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Fieldstall</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/index.html">Fieldstall<span class="dot">.</span></a>
    <div class="search-box"><input type="text" placeholder="Search products…" onclick="window.location.href='/index.html'"></div>
    <nav class="nav-links" id="auth-slot"></nav>
    <a href="/cart.html" class="nav-cart">Cart <span class="count" id="cart-count" style="display:none">0</span></a>
  </div>
</header>

<div class="container">
  <div class="page-title"><h1>Checkout</h1><p>Enter shipping details to place your order.</p></div>

  <div class="cart-layout" id="checkout-root">
    <div>
      <div id="form-error" class="form-error"></div>
      <form id="checkout-form">
        <div class="field">
          <label for="shippingName">Full name</label>
          <input id="shippingName" name="shippingName" required>
        </div>
        <div class="field">
          <label for="shippingAddress">Street address</label>
          <input id="shippingAddress" name="shippingAddress" required>
        </div>
        <div class="form-row-2">
          <div class="field">
            <label for="shippingCity">City</label>
            <input id="shippingCity" name="shippingCity" required>
          </div>
          <div class="field">
            <label for="shippingZip">ZIP / postal code</label>
            <input id="shippingZip" name="shippingZip" required>
          </div>
        </div>
        <button class="btn btn-marigold btn-block" type="submit" id="place-order-btn">Place order</button>
      </form>
    </div>

    <div id="summary-root">
      <p class="center-note">Loading summary…</p>
    </div>
  </div>
</div>

<footer>Fieldstall — a demo storefront built for learning. Not a real shop.</footer>

<script src="/js/main.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
